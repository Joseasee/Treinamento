<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vídeos Peat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f3;--ink:#12211a;--mute:#5b6b62;--line:#d3ddd6;--green:#00843d;--on:#fff;--deep:#0b3d2e;--yellow:#ffd23f;--card:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a14;--ink:#eaf2ec;--mute:#9fb2a6;--line:#25392e;--green:#38c172;--on:#04200f;--deep:#eaf2ec;--card:#15251c;--err:#ff9a90}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 0 18px}
h1{margin:0;font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:-.02em;color:var(--deep)}
header p,.sub{margin:2px 0 0;color:var(--mute)}
.btn{font:inherit;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
#login{min-height:100svh;display:grid;place-items:center;padding:24px}
#f{width:min(380px,100%);display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600}
label small{font-weight:400;color:var(--mute)}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.ent{font:inherit;font-weight:600;padding:11px 14px;border:0;border-radius:8px;background:var(--green);color:var(--on);cursor:pointer}
.ent:disabled{opacity:.6}
.erro{min-height:1.5em;margin:0;color:var(--err)}
.ok{color:var(--green)}
:is(input,textarea,.ent,.btn,summary,li button[data-id]):focus-visible{outline:3px solid var(--green);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start;padding-bottom:56px}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#sl{position:absolute;inset:0}
.msg{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:12px;padding:20px;text-align:center;color:#fff;background:rgba(0,0,0,.75)}
.msg p{margin:0;max-width:46ch}
#nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:12px 0 0}
#cnt{font-weight:600;min-width:10ch;text-align:center}
#visor:fullscreen{display:flex;flex-direction:column;background:#000}
#visor:fullscreen .stage{flex:1;aspect-ratio:auto;border-radius:0}
#visor:fullscreen #nav{padding:10px;color:#fff}
h2{margin:18px 0 4px;font-size:1.3rem;font-weight:600}
.mute{color:var(--mute);margin:0}
.dica{margin:10px 0 0;color:var(--mute);font-size:.95rem}
aside{position:sticky;top:16px}
aside h2{margin:0 0 10px;font-size:1rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;gap:4px}
li button[data-id]{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
li button[data-id]:hover{border-color:var(--green)}
li button[data-id][aria-current=true]{border-color:var(--green);box-shadow:inset 5px 0 0 var(--yellow)}
li button[data-id][aria-current=true] small::after{content:"Aberto agora";display:block;color:var(--green);font-weight:600}
li strong{display:block;font-weight:600;line-height:1.3}
li small{color:var(--mute)}
.th{position:relative;display:grid;place-items:center;aspect-ratio:16/9;background:#000;border-radius:5px;overflow:hidden;color:#fff;font-weight:800;font-size:.8rem}
.th::before{content:attr(data-t)}
.th.sl{background:#0b3d2e;color:#ffd23f}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-style:normal;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink);margin-bottom:2px}
.badge.sl{background:var(--yellow);color:#12211a}
.del{justify-self:end;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;color:var(--err);cursor:pointer}
.del:hover{border-color:var(--err);background:var(--card)}
#adm{margin:0 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 16px}
#adm summary{cursor:pointer;font-weight:600;padding:12px 0}
#fa{display:grid;gap:12px;padding:4px 0 16px;max-width:560px}
textarea{resize:vertical}
#fa input[type=file]{padding:8px}
@media (max-width:900px){.grid{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Ative o JavaScript do navegador para usar este site.</p></noscript>
<main id="login" hidden>
  <form id="f">
    <h1>Vídeos Peat</h1>
    <p class="sub">Área restrita. Digite a senha que você recebeu para assistir aos vídeos e às apresentações.</p>
    <label>Senha
      <span class="pw"><input id="s" type="password" autocomplete="current-password" required autofocus><button class="btn" id="ver" type="button" aria-label="Mostrar ou ocultar a senha">Mostrar</button></span>
    </label>
    <button class="ent" id="ent">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</main>
<div id="app" class="wrap" hidden>
  <header>
    <div>
      <h1>Vídeos Peat</h1>
      <p>Escolha um vídeo ou uma apresentação na lista e clique para abrir.</p>
    </div>
    <button class="btn" id="sair" type="button">Sair</button>
  </header>
  <details id="adm" hidden>
    <summary>Administração: adicionar vídeo ou apresentação</summary>
    <form id="fa">
      <label>Arquivo<small>Vídeo (MP4) ou apresentação do PowerPoint (.pptx). Até 50 MB no plano gratuito do Supabase.</small><input id="av" type="file" accept="video/*,.pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" required></label>
      <label>Título<input id="at" type="text" required maxlength="120"></label>
      <label>Descrição (opcional)<textarea id="ad" rows="2" maxlength="500"></textarea></label>
      <label>Imagem de capa (opcional)<small>Se não escolher, usamos uma imagem do próprio vídeo ou do primeiro slide.</small><input id="ac" type="file" accept="image/*"></label>
      <button class="ent" id="envia" type="submit">Enviar</button>
      <p class="erro" id="aviso" role="status"></p>
    </form>
  </details>
  <div class="grid">
    <section>
      <div id="visor">
        <div class="stage" id="stage">
          <video id="v" controls playsinline preload="metadata"></video>
          <div id="sl" hidden></div>
          <div class="msg" id="msg" role="status" hidden></div>
        </div>
        <div id="nav" hidden>
          <button class="btn" id="ant" type="button">◀ Slide anterior</button>
          <span id="cnt" aria-live="polite"></span>
          <button class="btn" id="prox" type="button">Próximo slide ▶</button>
          <button class="btn" id="tela" type="button">Tela cheia</button>
        </div>
      </div>
      <h2 id="t"></h2>
      <p class="mute" id="d"></p>
      <p class="dica" id="dica"></p>
    </section>
    <aside>
      <h2 id="qtd">Vídeos e apresentações</h2>
      <ul id="list"></ul>
    </aside>
  </div>
</div>
<script src="supabase.js"></script>
<script src="jszip.min.js"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s), v = $("#v"), list = $("#list"), stage = $("#stage"), visor = $("#visor");
const DIA = 864e5, PPTX = "application/vnd.openxmlformats-officedocument.presentationml.presentation";
const cfg = window.PEAT_CONFIG || {};
const configurado = /^https:\/\/.+\.supabase\.co\/?$/.test(cfg.url || "") && !/COLE/.test(cfg.url) && !!cfg.chave && !/COLE/.test(cfg.chave) && !!cfg.emailComum && !!cfg.emailAdm;
let sb = null;
try { if (configurado && window.supabase) sb = supabase.createClient(cfg.url, cfg.chave); } catch (e) { console.error(e); }
let catalogo = [], atual = null, adm = false, renovando = false, enviando = false, mem = 0;

// Guarda a hora do login (o aparelho fica lembrado por 24 h; ADM sem prazo). Funciona mesmo se o navegador bloquear o armazenamento.
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, x) => { try { localStorage.setItem(k, x); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
const entrada = () => Number(ls.get("peat:entrada")) || mem;
const marcar = () => { mem = Date.now(); ls.set("peat:entrada", String(mem)); };
const ehSlides = x => /\.pptx$/i.test(x.arquivo || "");
const hash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ""; } };
const el = (tag, css, pai) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (pai) pai.append(e); return e; };

// ---------- Leitor de PowerPoint (.pptx): tudo é desenhado aqui dentro da página ----------
const P = (() => {
  const EMU = 9525, R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", svg: "image/svg+xml", webp: "image/webp", bmp: "image/bmp", mp4: "video/mp4", m4v: "video/mp4", mov: "video/mp4", webm: "video/webm", ogv: "video/ogg", mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav", ogg: "audio/ogg" };
  const qa = (n, t) => [...n.getElementsByTagNameNS("*", t)], q1 = (n, t) => (n && n.getElementsByTagNameNS("*", t)[0]) || null;
  const kid = (n, t) => (n && [...n.children].find(c => c.localName === t)) || null, kids = (n, t) => n ? [...n.children].filter(c => c.localName === t) : [];
  const at = (n, a, d) => n && n.hasAttribute(a) ? n.getAttribute(a) : d, rid = (n, a) => (n && n.getAttributeNS(R, a)) || null;
  let z = null, slides = [], W = 960, H = 540, th = {}, cache = new Map(), urls = [], velhas = [], i = 0, tok = 0, MAS = null, wrap = null;
  const dir = p => p.slice(0, p.lastIndexOf("/") + 1);
  const norm = p => p.split("/").reduce((o, s) => (s === ".." ? o.pop() : s && s !== "." && o.push(s), o), []).join("/");
  const X = s => { const d = new DOMParser().parseFromString(s, "application/xml"); if (d.getElementsByTagName("parsererror").length) throw new Error("XML inválido"); return d; };
  const txt = async p => { const f = z.file(p); if (!f) throw new Error("Falta " + p); return X(await f.async("string")); };
  async function rels(p) {
    const f = z.file(dir(p) + "_rels/" + p.slice(dir(p).length) + ".rels"), m = {};
    if (f) for (const e of qa(X(await f.async("string")), "Relationship")) {
      const t = e.getAttribute("Target"), ext = e.getAttribute("TargetMode") === "External";
      m[e.getAttribute("Id")] = { ty: e.getAttribute("Type"), ext, t: ext ? t : norm(t[0] === "/" ? t : dir(p) + t) };
    }
    return m;
  }
  async function carregar(p) {
    if (!p) return null;
    if (!cache.has(p)) { if (!z.file(p)) return null; cache.set(p, { x: await txt(p), r: await rels(p) }); }
    return cache.get(p);
  }
  const rel = (d, re) => d && Object.values(d.r).find(r => re.test(r.ty));
  async function url(p) {
    const f = z.file(p); if (!f) return "";
    const b = await f.async("blob"), u = URL.createObjectURL(b.slice(0, b.size, MIME[p.split(".").pop().toLowerCase()] || b.type));
    urls.push(u); return u;
  }
  function cor(f) {   // cor do PowerPoint (tema, luminosidade e transparência) em CSS
    const c = f && (/Clr$/.test(f.localName) ? f : [...f.children].find(e => /Clr$/.test(e.localName)));
    if (!c) return null;
    const k = c.localName, val = c.getAttribute("val"), hex = k === "srgbClr" ? val : k === "sysClr" ? c.getAttribute("lastClr") : k === "schemeClr" ? th[val] : null;
    if (!hex || hex.length < 6) return null;
    let [r, g, b] = [0, 2, 4].map(j => parseInt(hex.substr(j, 2), 16) / 255);
    const m = kid(c, "lumMod"), o = kid(c, "lumOff");
    if (m || o) {
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let l = (mx + mn) / 2, h = 0, s = 0;
      if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; }
      l = Math.min(1, Math.max(0, l * (m ? m.getAttribute("val") / 1e5 : 1) + (o ? o.getAttribute("val") / 1e5 : 0)));
      const a = s * Math.min(l, 1 - l), f2 = n => { const q = (n + h * 2) % 12; return l - a * Math.max(-1, Math.min(q - 3, 9 - q, 1)); };
      [r, g, b] = [f2(0), f2(8), f2(4)];
    }
    const al = kid(c, "alpha"), rgb = [r, g, b].map(x => Math.round(x * 255)).join(",");
    return al ? `rgba(${rgb},${al.getAttribute("val") / 1e5})` : `rgb(${rgb})`;
  }
  const xfOf = n => kid(kid(n, "spPr"), "xfrm") || kid(kid(n, "grpSpPr"), "xfrm") || kid(n, "xfrm");
  const rect = x => { const o = kid(x, "off"), e = kid(x, "ext"); return o && e ? { x: +o.getAttribute("x"), y: +o.getAttribute("y"), w: +e.getAttribute("cx"), h: +e.getAttribute("cy"), r: +at(x, "rot", 0) / 6e4, fh: at(x, "flipH") === "1", fv: at(x, "flipV") === "1" } : null; };
  const mapR = (g, r) => ({ ...r, x: g.x0 + (r.x - g.cx0) * g.sx, y: g.y0 + (r.y - g.cy0) * g.sy, w: r.w * g.sx, h: r.h * g.sy });
  const pos = r => `position:absolute;left:${r.x / EMU}px;top:${r.y / EMU}px;width:${r.w / EMU}px;height:${r.h / EMU}px;box-sizing:border-box;` + (r.r || r.fh || r.fv ? `transform:rotate(${r.r}deg) scale(${r.fh ? -1 : 1},${r.fv ? -1 : 1});` : "");
  const nota = (pai, t) => { el("div", "position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px;background:rgba(0,0,0,.75);color:#fff;font:14px sans-serif", pai).textContent = t; };
  const T = p => { const t = at(p, "type", "body"); return t === "ctrTitle" ? "title" : t === "subTitle" ? "body" : t; };
  const achar = (d, p, soTipo) => d && qa(d.x, "sp").find(s => { const q = q1(s, "ph"); return q && ((!soTipo && at(p, "idx") != null && at(q, "idx") === at(p, "idx")) || (T(q) === T(p) && (soTipo || at(p, "idx") == null))); }) || null;

  function texto(tb, box, o) {
    const bp = kid(tb, "bodyPr"), ph = o.ph, tp = ph ? T(ph) : "outro", st = tp === "title" ? "titleStyle" : /^(body|obj)$/.test(tp) ? "bodyStyle" : "otherStyle";
    const bpo = s => kid(kid(s, "txBody"), "bodyPr"), anc = [bp, bpo(o.lay), bpo(o.mas)].map(b => at(b, "anchor")).find(Boolean) || "t";
    const af = kid(bp, "normAutofit"), fs = af ? +at(af, "fontScale", 1e5) / 1e5 : 1;
    const w = o.cell ? box : el("div", `position:absolute;inset:0;display:flex;flex-direction:column;justify-content:${{ ctr: "center", b: "flex-end" }[anc] || "flex-start"};padding:${at(bp, "tIns", 45720) / EMU}px ${at(bp, "rIns", 91440) / EMU}px ${at(bp, "bIns", 45720) / EMU}px ${at(bp, "lIns", 91440) / EMU}px`, box);
    if (at(bp, "wrap") === "none") w.style.whiteSpace = "nowrap";
    let num = 0;
    kids(tb, "p").forEach((p, pi) => {
      const pp = kid(p, "pPr"), L = `lvl${+at(pp, "lvl", 0) + 1}pPr`, ts = MAS && kid(q1(MAS, "txStyles"), st);
      const cad = [...[o.n, o.lay, o.mas].map(s => kid(kid(kid(s, "txBody"), "lstStyle"), L)), kid(ts, L)].filter(Boolean);
      const dr = c => kid(c, "defRPr"), herda = k => at(pp, k) ?? cad.map(c => at(c, k)).find(x => x != null);
      const bu = [pp, ...cad].map(c => kid(c, "buNone") || kid(c, "buChar") || kid(c, "buAutoNum")).find(Boolean);
      num = bu && bu.localName === "buAutoNum" ? num + 1 : 0;
      const alg = herda("algn") || "l", ml = (+herda("marL") || 0) / EMU, ind = (+herda("indent") || 0) / EMU;
      const base = +(at(kid(p, "endParaRPr"), "sz") ?? cad.map(c => at(dr(c), "sz")).find(x => x != null) ?? 1800);
      const e = el("div", `text-align:${{ ctr: "center", r: "right", just: "justify" }[alg] || "left"};padding-left:${ml}px;text-indent:${ind}px;margin-top:${pi ? ".2em" : 0};font-size:${base / 75 * fs}px`, w);
      for (const rn of p.children) {
        if (rn.localName === "br") { e.append(document.createElement("br")); continue; }
        const t = (rn.localName === "r" || rn.localName === "fld") && kid(rn, "t"); if (!t) continue;
        const rp = kid(rn, "rPr"), g = k => at(rp, k) ?? cad.map(c => at(dr(c), k)).find(x => x != null);
        const sp = el("span", `font-size:${(+g("sz") || 1800) / 75 * fs}px`, e); sp.textContent = t.textContent;
        if (g("b") === "1") sp.style.fontWeight = "700";
        if (g("i") === "1") sp.style.fontStyle = "italic";
        if (/^(sng|dbl)/.test(g("u") || "")) sp.style.textDecoration = "underline";
        const c = cor(kid(rp, "solidFill")) || cad.map(q => cor(kid(dr(q), "solidFill"))).find(Boolean); if (c) sp.style.color = c;
        const ft = at(kid(rp, "latin"), "typeface"); if (ft && ft[0] !== "+") sp.style.fontFamily = `"${ft.replace(/"/g, "")}",Calibri,Carlito,Arial,sans-serif`;
      }
      if (!e.textContent) e.append("\u200b");
      else if (bu && bu.localName !== "buNone") { const ch = bu.getAttribute("char") || "•"; e.prepend(bu.localName === "buChar" ? (/[A-Za-z§Øüý¨]/.test(ch) ? "•" : ch) + " " : num + ". "); }
    });
  }

  async function forma(n, g, d, s, ctx, decor) {
    const ph = q1(kid(kid(n, "nvSpPr"), "nvPr"), "ph");
    if (ph && decor) return;   // marcadores do layout/mestre (títulos, rodapés) não aparecem
    let r = rect(xfOf(n)), lay = null, mas = null;
    if (ph) { lay = achar(ctx.lay, ph); mas = achar(ctx.mas, ph, true); r = r || rect(xfOf(lay)) || rect(xfOf(mas)); }
    if (!r) return;
    const pr = kid(n, "spPr"), ln = kid(pr, "ln"), lf = kid(ln, "solidFill"), geo = at(q1(pr, "prstGeom"), "prst");
    const f = kid(pr, "noFill") ? null : kid(pr, "solidFill") || kid(kid(lay, "spPr"), "solidFill") || kid(kid(mas, "spPr"), "solidFill");
    const box = el("div", pos(mapR(g, r)) + `color:#${th.tx1 || "000"}`, s);
    if (f) box.style.background = cor(f);
    if (lf) box.style.border = `${Math.max(1, +at(ln, "w", 12700) / EMU)}px solid ${cor(lf)}`;
    if (geo === "ellipse") box.style.borderRadius = "50%"; else if (geo === "roundRect") box.style.borderRadius = "12%";
    const tb = kid(n, "txBody"); if (tb) texto(tb, box, { n, ph, lay, mas });
  }

  async function figura(n, g, d, s, ctx) {   // imagens, vídeos e áudios
    const r = rect(xfOf(n)); if (!r) return;
    const box = el("div", pos(mapR(g, r)) + "overflow:hidden", s), nvp = kid(kid(n, "nvPicPr"), "nvPr"), bf = kid(n, "blipFill");
    const im = d.r[rid(q1(bf, "blip"), "embed")], vf = q1(nvp, "videoFile"), af = q1(nvp, "audioFile"), mf = vf || af;
    const mr = mf && (d.r[rid(q1(nvp, "media"), "embed")] || d.r[rid(mf, "link")]);
    const capa = im && !im.ext && /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(im.t) ? await url(im.t) : "";
    if (mr) {
      const m = el(vf ? "video" : "audio", "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000", box);
      m.controls = true; m.preload = "metadata"; m.playsInline = true; if (vf && capa) m.poster = capa;
      m.onerror = () => { if (m.getAttribute("src")) nota(box, "Este vídeo está em um formato que o navegador não toca. Converta para MP4 (H.264) e insira de novo no PowerPoint."); };
      if (mr.ext) { if (/^https:\/\//i.test(mr.t)) m.src = mr.t; else nota(box, "Este vídeo está vinculado a um arquivo fora do PowerPoint e não pode ser exibido aqui."); }
      else url(mr.t).then(u => ctx.vivo() ? (m.src = u) : URL.revokeObjectURL(u));
      return;

async function baixar(r, andamento) {   // baixa o arquivo mostrando a porcentagem
  const total = +r.headers.get("content-length") || 0;
  if (!r.body || !total) return r.arrayBuffer();
  const rd = r.body.getReader(), partes = []; let n = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; partes.push(value); n += value.length; andamento(Math.min(100, Math.round(n / total * 100))); }
  const out = new Uint8Array(n); let o = 0;
  for (const p of partes) { out.set(p, o); o += p.length; }
  return out.buffer;
}

async function abrir(id, tocar) {

  $("#t").textContent = x.titulo; $("#d").textContent = x.descricao || "";
  $("#dica").textContent = sl ? "Use os botões abaixo ou as setas ← → do teclado para trocar de slide. Se o slide tiver um vídeo, clique no play dentro dele." : "Clique no botão de play para assistir. O ícone no canto do vídeo abre em tela cheia.";

async function abrirApp(abrirId) {
  const { data, error } = await sb.from("catalogo").select("id,titulo,descricao,duracao,arquivo,capa,ordem").order("ordem");
  if (error) throw error;
  catalogo = data || [];
  list.replaceChildren();
  for (const x of catalogo) {
    const li = document.createElement("li"), b = document.createElement("button"), sl = ehSlides(x);
    b.type = "button"; b.dataset.id = x.id;
    b.innerHTML = '<span class="th"><img alt=""></span><span><em class="badge"></em><strong></strong><small></small></span>';
    const th = b.querySelector(".th"), bd = b.querySelector(".badge");
    th.dataset.t = sl ? "Slides" : "▶"; th.classList.toggle("sl", sl);
    bd.textContent = sl ? "Apresentação" : "Vídeo"; bd.classList.toggle("sl", sl);
    b.querySelector("img").onerror = e => e.target.removeAttribute("src");
    b.querySelector("strong").textContent = x.titulo;
    b.querySelector("small").textContent = x.duracao || "";
    b.onclick = () => abrir(x.id, true);
    li.append(b);
    if (adm) {
      const d = document.createElement("button");
      d.type = "button"; d.className = "del"; d.textContent = "Excluir";
      d.setAttribute("aria-label", "Excluir " + x.titulo);
      d.onclick = () => excluir(x);
      li.append(d);

  }

  $("#login").hidden = true; $("#app").hidden = false; $("#adm").hidden = !adm;
  abrir(abrirId ?? hash(), false);
  const caminhos = catalogo.map(x => x.capa).filter(Boolean);
  if (!caminhos.length) return;
  sb.storage.from("videos").createSignedUrls(caminhos, 3600).then(({ data: urls }) => {
    (urls || []).forEach(u => {
      const i = catalogo.findIndex(x => x.capa === u.path);
      if (i < 0 || !u.signedUrl) return;
      catalogo[i].capaUrl = u.signedUrl;
      list.children[i].querySelector("img").src = u.signedUrl;
      if (atual === catalogo[i] && !ehSlides(atual)) v.poster = u.signedUrl;
    });
  }).catch(() => {});
}

const aviso = (txt, ok) => { const a = $("#aviso"); a.textContent = txt; a.classList.toggle("ok", !!ok); };

function slug(t) {
  return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "video";
}

// Lê a duração e tira uma imagem do vídeo (para a capa), tudo no navegador.
function lerVideo(arquivo) {
  return new Promise(resolve => {
    const e = document.createElement("video"), u = URL.createObjectURL(arquivo);
    let duracao = "", feito = false;
    const fim = capa => { if (feito) return; feito = true; URL.revokeObjectURL(u); resolve({ duracao, capa }); };
    e.muted = true; e.preload = "metadata"; e.playsInline = true;
    e.onerror = () => fim(null);
    e.onloadedmetadata = () => {
      const t = Math.round(e.duration || 0);
      duracao = isFinite(t) && t > 0 ? `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}` : "";
      e.currentTime = Math.min(20, (e.duration || 2) / 2);
    };
    e.onseeked = () => {
      try {
        const c = document.createElement("canvas");
        c.width = 640; c.height = Math.round(640 * (e.videoHeight || 360) / (e.videoWidth || 640));
        c.getContext("2d").drawImage(e, 0, 0, c.width, c.height);
        c.toBlob(b => fim(b), "image/jpeg", 0.8);
      } catch { fim(null); }
    };
    setTimeout(() => fim(null), 15000);
    e.src = u;
  });
}

// Conta os slides e usa a miniatura que o PowerPoint guarda dentro do arquivo como capa.
async function lerPptx(arq) {
  if (typeof JSZip === "undefined") throw new Error("Falta enviar o arquivo jszip.min.js para o site.");
  const invalido = new Error("O arquivo não parece ser uma apresentação .pptx válida.");
  let zz; try { zz = await JSZip.loadAsync(arq); } catch { throw invalido; }
  if (!zz.file("ppt/presentation.xml")) throw invalido;
  const n = Object.keys(zz.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).length, mini = zz.file("docProps/thumbnail.jpeg");
  let capa = null;
  if (mini) { const b = await mini.async("blob"); capa = b.slice(0, b.size, "image/jpeg"); }
  return { duracao: n + (n === 1 ? " slide" : " slides"), capa };
}

$("#fa").onsubmit = async e => {
  e.preventDefault();

  if (!titulo || !vf) return;

    if (r.error) throw r.error;
    subidos.push(arquivo);

// A senha comum e a de ADM são de duas contas internas; a página tenta uma e depois a outra.
async function entrar(senha) {
  for (const email of [cfg.emailComum, cfg.emailAdm]) {
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (!error) return null;
    if (error.code !== "invalid_credentials" && error.status !== 400) return error;
  }
  return { code: "invalid_credentials" };
}

      $("#s").value = "";
      const r = await iniciarSessao();
      if (r !== "ok") { await sb.auth.signOut(); erro.textContent = "Esta senha não tem acesso liberado."; }
    }
  } catch (err) { console.warn(err); erro.textContent = "Não foi possível carregar os vídeos. Verifique a internet e tente de novo."; }
  btn.disabled = false;
};

$("#sair").onclick = () => sair();
$("#ant").onclick = () => P.ir(P.i - 1);
$("#prox").onclick = () => P.ir(P.i + 1);
$("#tela").hidden = !document.fullscreenEnabled;
$("#tela").onclick = () => document.fullscreenElement ? document.exitFullscreen() : visor.requestFullscreen();
addEventListener("keydown", e => {
  if (!P.ativo() || /^(VIDEO|AUDIO|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown") P.ir(P.i + 1);
  else if (k === "ArrowLeft" || k === "PageUp") P.ir(P.i - 1);
  else if (k === "Home") P.ir(0);
  else if (k === "End") P.ir(1e9);
  else return;
  e.preventDefault();
});
if (window.ResizeObserver) new ResizeObserver(() => P.ajustar()).observe(stage);
addEventListener("resize", () => P.ajustar());
addEventListener("hashchange", () => { if (!$("#app").hidden) abrir(hash(), false); });
setInterval(() => { if (!$("#app").hidden && !adm && Date.now() - entrada() > DIA) sair("Por segurança, o acesso vale por 24 horas. Digite a senha de novo."); }, 60000);

(async () => {
  if (!configurado || !sb) {
    $("#login").hidden = false; $("#ent").disabled = true;
    $("#erro").textContent = "Falta preencher o arquivo config.js com os dados do Supabase.";
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") mostrarLogin(); });
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const r = await iniciarSessao();
      if (r === "ok") return;
      await sair(r === "expirou" ? "Por segurança, o acesso vale por 24 horas. Digite a senha de novo." : "Esta conta não tem acesso liberado.");
    }
  } catch (e) { console.warn(e); $("#erro").textContent = "Sem conexão com o servidor. Verifique a internet e atualize a página."; }
  $("#login").hidden = false;
})();
</script>
</body>
</html>
